<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noisecore - Membership</title>
    <link rel="stylesheet" href="../css/membership.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <a href="#" class="navbar-logo">Noisecore<span></span></a>

      <div class="navbar-nav" id="navbarNav">
        <a href="home.html">Home</a>
        <a href="product.html">Product</a>
        <a href="about.html">About Us</a>
        <a href="deals.html">Deals</a>
        <a href="membership.html" class="active">Membership</a>
      </div>

      <div class="navbar-extra">
        <a href="#" id="search"><i data-feather="search"></i></a>
        <a href="#" id="shopping-cart"><i data-feather="shopping-cart"></i></a>
        <a href="#" id="hamburger-menu"><i data-feather="menu"></i></a>
      </div>
    </nav>

    <main class="container">
      <h1>Join Our Membership</h1>
      <form id="membershipForm" novalidate>
        <div class="input-group">
          <label for="name">Name *</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
          />
          <span class="error" id="error-name"></span>
        </div>

        <div class="input-group">
          <label for="email">Email *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
          />
          <span class="error" id="error-email"></span>
        </div>

        <fieldset class="input-group gender-group">
          <legend>Gender *</legend>
          <label><input type="radio" name="gender" value="male" /> Male</label>
          <label
            ><input type="radio" name="gender" value="female" /> Female</label
          >

          <span class="error" id="error-gender"></span>
        </fieldset>

        <div class="input-group">
          <label for="dob">Date of Birth *</label>
          <input type="date" id="dob" name="dob" max="" />
          <span class="error" id="error-dob"></span>
        </div>

        <div class="input-group">
          <label for="password">Password *</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
          />
          <span class="error" id="error-password"></span>
        </div>

        <div class="input-group checkbox-group">
          <input type="checkbox" id="agreement" name="agreement" />
          <label for="agreement">I agree to the terms and conditions *</label>
          <span class="error" id="error-agreement"></span>
        </div>

        <button type="submit">Submit</button>
      </form>
    </main>

    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="../js/navbar.js" />
    <link rel="stylesheet" href="../js/validation.js" />

    <script>
      feather.replace();
    </script>
  </body>
</html>
